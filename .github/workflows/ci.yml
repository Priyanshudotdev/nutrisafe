name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Server AI smoke tests (mocked, no keys needed)
        run: node server/ai.smoke-test.js

      - name: Server AI e2e tests (mock provider, no keys needed)
        run: node server/ai.e2e-test.js
