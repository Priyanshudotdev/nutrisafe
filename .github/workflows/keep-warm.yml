# Keeps the free Render API warm by pinging /health on a schedule.
# Render spins free services down after ~15 min of idleness — a hit every
# 10 min prevents cold starts. Public endpoint, so no secrets needed.
# Manual runs: Actions tab → "Keep Render API warm" → Run workflow.
name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 100 --retry 2 --retry-delay 20 \
            https://nutrisafe-server.onrender.com/health \
            || echo "Ping missed (service may be cold-starting) — next tick in 10 min."
